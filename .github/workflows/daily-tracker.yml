name: Daily Gmail Internship Tracker

# Manual fallback only. The daily run is Cloud Scheduler -> Cloud Run
# (deploy/deploy.sh), which uses Gemini. Keeping one scheduled writer avoids
# two jobs updating the sheet at once.
on:
  workflow_dispatch:

jobs:
  track-applications:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create credentials.json from secret
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
    
    - name: Create token.json from secret
      run: |
        echo '${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}' > token.json
    
    - name: Run Gmail tracker
      run: |
        python main.py
      env:
        PYTHONPATH: ${{ github.workspace }}
        # No GCP credentials in this runner: use the heuristic classifier.
        USE_LLM: "false"
    
    - name: Clean up sensitive files
      if: always()
      run: |
        rm -f credentials.json token.json
